name: Backend CI/CD to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/coldchain-backend:${{ github.sha }} ./backend
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/coldchain-backend:latest ./backend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/coldchain-backend:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/coldchain-backend:latest

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: coldchain-backend
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/coldchain-backend:${{ github.sha }}
